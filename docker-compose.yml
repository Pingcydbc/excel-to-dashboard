services:
  # ====================================================
  # 1. PostgreSQL 16 Database Service
  # ====================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: vcop_cmtc_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${HOST_DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - vcop-net

  # ====================================================
  # 2. V-COP CMTC Next.js Web Application
  # ====================================================
  vcop-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcop_cmtc_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres-db:5432/${DB_NAME}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - REPORT_EMAIL=${REPORT_EMAIL}
      - REPORT_PASSWORD=${REPORT_PASSWORD}
    depends_on:
      - postgres-db
    networks:
      - vcop-net

networks:
  vcop-net:
    driver: bridge

volumes:
  pgdata:
    name: vcop_cmtc_data_v2
