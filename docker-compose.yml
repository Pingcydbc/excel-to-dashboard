version: '3.8'

services:
  # PostgreSQL 16 Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: vcop_cmtc_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: student_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vcop-net

  # V-COP CMTC Next.js Web Service
  vcop-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vcop_cmtc_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password123@postgres-db:5432/student_dashboard?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_2026_excel_to_dashboard}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admincmtcvcop123}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - vcop-net

networks:
  vcop-net:
    driver: bridge

volumes:
  pgdata:
